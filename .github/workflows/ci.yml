name: Data Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-validation:
    name: Validate dbt Models & Airflow DAGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake apache-airflow

      - name: Validate Airflow DAG Syntax
        run: |
          python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in glob.glob('dags/*.py')]"

      - name: Test dbt Parsing & Syntax
        run: |
          cd dbt_proptech
          dbt parse --profiles-dir . || true
